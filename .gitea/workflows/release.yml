name: release

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '.gitea/**'
      - '.github/**'
      - 'renovate.json'
      - '.editorconfig'
      - '.gitattributes'
      - 'LICENSE'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Run tests
        run: dotnet test tests/SendSpin.Tests -v minimal

  release:
    needs: [test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITEA_TOKEN || github.token }}

      - name: Verify dotnet
        shell: pwsh
        run: |
          dotnet --version
          dotnet --list-sdks

      - name: Read version + check if already released
        id: version
        shell: pwsh
        run: |
          $csproj = "MusicBeeSendSpin.csproj"
          $major = [int](Select-String -Path $csproj -Pattern '<VersionMajor>(\d+)</VersionMajor>').Matches[0].Groups[1].Value
          $minor = [int](Select-String -Path $csproj -Pattern '<VersionMinor>(\d+)</VersionMinor>').Matches[0].Groups[1].Value
          $rev   = [int](Select-String -Path $csproj -Pattern '<VersionRevision>(\d+)</VersionRevision>').Matches[0].Groups[1].Value

          # Re-trigger guard: our own bump push re-triggers this workflow at a tagged commit -> skip there only
          $tagAtHead = git describe --tags --exact-match 2>$null
          $LASTEXITCODE = 0 # no tags yet (first release) is expected; don't let it fail the step
          if ($tagAtHead) {
            Write-Host "HEAD is tagged $tagAtHead (re-trigger of our own bump) - skipping release."
            "skip=true" >> $env:GITHUB_OUTPUT
          }

          $rev = $rev + 1
          if ($rev -gt 9) { $rev = 0; $minor = $minor + 1; if ($minor -gt 9) { $minor = 0; $major = $major + 1 } }
          $new = "v$major.$minor.$rev"
          Write-Host "Bumping to $new"
          "new=$new" >> $env:GITHUB_OUTPUT
          "major=$major" >> $env:GITHUB_OUTPUT
          "minor=$minor" >> $env:GITHUB_OUTPUT
          "rev=$rev" >> $env:GITHUB_OUTPUT

      - name: Write new version into MusicBeeSendSpin.csproj
        if: steps.version.outputs.skip != 'true'
        shell: pwsh
        env:
          NEW_MAJOR: ${{ steps.version.outputs.major }}
          NEW_MINOR: ${{ steps.version.outputs.minor }}
          NEW_REV: ${{ steps.version.outputs.rev }}
        run: |
          $csproj = "MusicBeeSendSpin.csproj"
          $content = Get-Content $csproj -Raw
          $content = $content -replace '(?m)^([ ]*<VersionMajor>)\d+(</VersionMajor>)', "`${1}$env:NEW_MAJOR`${2}"
          $content = $content -replace '(?m)^([ ]*<VersionMinor>)\d+(</VersionMinor>)', "`${1}$env:NEW_MINOR`${2}"
          $content = $content -replace '(?m)^([ ]*<VersionRevision>)\d+(</VersionRevision>)', "`${1}$env:NEW_REV`${2}"
          Set-Content -Path $csproj -Value $content -NoNewline
          git diff $csproj

      - name: Restore dependencies
        if: steps.version.outputs.skip != 'true'
        shell: pwsh
        run: dotnet restore MusicBeeSendSpin.csproj

      - name: Build
        if: steps.version.outputs.skip != 'true'
        shell: pwsh
        run: dotnet build MusicBeeSendSpin.csproj --configuration Release --no-restore

      - name: Generate release notes
        if: steps.version.outputs.skip != 'true'
        id: release_notes
        shell: pwsh
        run: |
          $previousTag = git describe --tags --abbrev=0 2>$null
          if ($previousTag) {
            $commits = git log "$previousTag..HEAD" --pretty=format:"- %s (%h)" --no-merges
          } else {
            $commits = git log -20 --pretty=format:"- %s (%h)" --no-merges
          }
          "## What's Changed`n`n$($commits -join "`n")" | Out-File -FilePath release_notes.md -Encoding utf8
          Write-Host $commits

      - name: Commit bump, push, and tag
        if: steps.version.outputs.skip != 'true'
        shell: pwsh
        env:
          PUSH_TOKEN: ${{ secrets.GITEA_TOKEN || github.token }}
        run: |
          git config user.name "gitea-bot"
          git config user.email "bot@gitea.local"
          git add SendSpinPlugin.cs
          git commit -m "chore: bump version to ${{ steps.version.outputs.new }}"
          git tag ${{ steps.version.outputs.new }}
          $remote = (git remote get-url origin) -replace '^https?://', "https://x:$PUSH_TOKEN@"
          git remote set-url origin $remote
          git push origin HEAD:main ${{ steps.version.outputs.new }}

      - name: Create Gitea Release
        if: steps.version.outputs.skip != 'true'
        uses: akkuman/gitea-release-action@v1
        with:
          token: ${{ secrets.GITEA_TOKEN || github.token }}
          files: |-
            bin/Release/net48/mb_SendSpin.dll
          name: ${{ steps.version.outputs.new }}
          tag_name: ${{ steps.version.outputs.new }}
          body_path: release_notes.md
